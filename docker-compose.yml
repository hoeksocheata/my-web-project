# ដំណើរការ: docker compose up --build   → http://localhost:8000
services:
  app:
    build: .
    ports: ["8000:10000"]
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: bookstore
      DB_USERNAME: bookstore
      DB_PASSWORD: secret
      RUN_SEED: "true"
      BOOKSTORE_DEMO: "true"
      SESSION_DRIVER: file
    depends_on:
      db: { condition: service_healthy }
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: bookstore
      MYSQL_USER: bookstore
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-psecret"]
      interval: 5s
      retries: 20
    volumes: [dbdata:/var/lib/mysql]
volumes:
  dbdata:
